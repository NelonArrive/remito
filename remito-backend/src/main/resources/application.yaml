spring:
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/remito_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate # validate
    show-sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
          yandex:
            provider: yandex
            client-id: ${YANDEX_CLIENT_ID:dummy-yandex-client-id}
            client-secret: ${YANDEX_CLIENT_SECRET:dummy-yandex-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - login:info
              - login:email

        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: default_email

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 2592000000

server:
  port: 8080

api:
  prefix: /api/v1

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    to: ${ADMIN_EMAIL:info@ремито.рф}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:dummy-bot-token}
    chat-id: ${TELEGRAM_CHAT_ID:123456789}

storage:
  r2:
    endpoint: https://nelonarrive.r2.cloudflarestorage.com
    access-key: R2_ACCESS_KEY_ID
    secret-key: R2_SECRET_ACCESS_KEY
    bucket: remito-products
    region: auto
    prefix: products


springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    dev.remito: DEBUG